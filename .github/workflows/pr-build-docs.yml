name: PR Document Build

on:
  pull_request:
    branches: [ master ]

concurrency:
  group: pr-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Note: Windows removed from matrix - users must use WSL2 (Linux) per project requirements
        # Windows users follow Linux installation instructions via WSL2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX Live and latexmk (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-full

      - name: Install MacTeX (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📄 Installing MacTeX on macOS"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Check if Homebrew is installed
          if ! command -v brew >/dev/null 2>&1; then
            echo "Installing Homebrew..."
            /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi
          
          # Check if MacTeX is already installed
          if [ -d "/Library/TeX/texbin" ] && command -v pdflatex >/dev/null 2>&1; then
            echo "✅ MacTeX appears to be already installed"
            pdflatex --version | head -1
          else
            echo "Installing MacTeX via Homebrew (this may take 10-15 minutes)..."
            brew install --cask mactex
            
            # Add MacTeX to PATH for this session
            export PATH="/Library/TeX/texbin:$PATH"
            echo "/Library/TeX/texbin" >> $GITHUB_PATH
          fi
          
          # Ensure MacTeX is in PATH
          export PATH="/Library/TeX/texbin:$PATH"
          echo "/Library/TeX/texbin" >> $GITHUB_PATH
          
          # Verify installation
          if command -v pdflatex >/dev/null 2>&1; then
            echo "✅ pdflatex installed: $(which pdflatex)"
            pdflatex --version | head -1
          else
            echo "❌ pdflatex not found after installation"
              exit 1
          fi
          
          # Verify latexmk is available
          if command -v latexmk >/dev/null 2>&1; then
            echo "✅ latexmk: $(which latexmk)"
            latexmk --version | head -1
          else
            echo "⚠️  latexmk not found, installing..."
            brew install latexmk || echo "latexmk installation failed, continuing..."
          fi

      - name: Build PDFs
        shell: bash
        env:
          LATEX_OPTS: "-interaction=nonstopmode"
        run: |
          echo "=== Building PDFs with latexmk ==="
          
          # macOS: Ensure MacTeX is in PATH
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export PATH="/Library/TeX/texbin:$PATH"
          fi
          
          if [ -f reproduce/reproduce_documents.sh ]; then
            bash reproduce/reproduce_documents.sh
          else
            echo "Warning: reproduce/reproduce_documents.sh not found"
            # Fallback: try to compile main document if it exists
            if [ -f HAFiscal.tex ]; then
              latexmk -pdf -interaction=nonstopmode HAFiscal.tex
            fi
          fi
          echo "PDF build completed"

      - name: Upload PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PDFs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            HAFiscal.pdf
            HAFiscal-online-appendix.pdf
            HAFiscal-Slides.pdf
