name: Sync to econ-ark/HAFiscal

# This workflow enforces the repository architecture:
# HAFiscal-Latest → HAFiscal-Public → econ-ark/HAFiscal
#
# Triggers when HAFiscal-Public is updated, automatically syncing
# to econ-ark/HAFiscal with proper provenance tracking.

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      public_commit:
        description: 'HAFiscal-Public commit to sync (leave empty for latest)'
        required: false
        type: string
      
  # Automatic trigger from makePublic completion (requires repository_dispatch event)
  repository_dispatch:
    types: [public-updated]

jobs:
  sync:
    name: Sync to econ-ark/HAFiscal
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout HAFiscal-Latest
        uses: actions/checkout@v4
        with:
          path: HAFiscal-Latest
          
      - name: Checkout HAFiscal-Public
        uses: actions/checkout@v4
        with:
          repository: llorracc/HAFiscal-Public
          path: HAFiscal-Public
          token: ${{ secrets.HAFISCAL_SYNC_TOKEN }}
          
      - name: Checkout econ-ark/HAFiscal
        uses: actions/checkout@v4
        with:
          repository: econ-ark/HAFiscal
          path: econ-ark-HAFiscal
          token: ${{ secrets.HAFISCAL_SYNC_TOKEN }}
          
      - name: Get source commit info
        id: source
        run: |
          cd HAFiscal-Public
          echo "commit=$(git log -1 --format='%H')" >> $GITHUB_OUTPUT
          echo "short=$(git log -1 --format='%h')" >> $GITHUB_OUTPUT
          echo "message=$(git log -1 --format='%s')" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format='%ci')" >> $GITHUB_OUTPUT
          
      - name: Sync files from Public to econ-ark
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.swp' \
            --exclude='*~' \
            --exclude='.DS_Store' \
            HAFiscal-Public/ econ-ark-HAFiscal/
            
      - name: Remove DO-NOT-EDIT file from econ-ark
        run: |
          # Remove DO-NOT-EDIT-THIS-REPOSITORY.md (not needed for public fork)
          if [ -f econ-ark-HAFiscal/DO-NOT-EDIT-THIS-REPOSITORY.md ]; then
            rm -f econ-ark-HAFiscal/DO-NOT-EDIT-THIS-REPOSITORY.md
            echo "✓ DO-NOT-EDIT file removed (econ-ark is a public fork, not a private staging repo)"
          else
            echo "✓ DO-NOT-EDIT file not present (already clean)"
          fi
            
      - name: Check for changes
        id: changes
        run: |
          cd econ-ark-HAFiscal
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "⚠️  No changes - econ-ark/HAFiscal already up to date"
          fi
          
      - name: Create sync commit
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd econ-ark-HAFiscal
          
          # Configure git
          git config user.name "HAFiscal Sync Bot"
          git config user.email "hafiscal-sync-bot@econ-ark.org"
          
          # Create commit with provenance
          cat > /tmp/commit_msg <<EOF
          Sync from llorracc/HAFiscal-Public@${{ steps.source.outputs.short }}
          
          Generated by: GitHub Actions workflow (sync-to-econ-ark.yml)
          Source: llorracc/HAFiscal-Public@${{ steps.source.outputs.commit }}
          Source message: ${{ steps.source.outputs.message }}
          Source date: ${{ steps.source.outputs.date }}
          
          This is a generated repository. Do not edit directly.
          Source of truth: llorracc/HAFiscal-Latest

          Workflow: HAFiscal-Latest → makePublic → HAFiscal-Public → econ-ark/HAFiscal

          See: HAFiscal-dev/docs/project/REPOSITORY_ARCHITECTURE.md
          EOF
          
          git add -A
          git commit -F /tmp/commit_msg
          
      - name: Push to econ-ark/HAFiscal
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd econ-ark-HAFiscal
          git push origin master
          
      - name: Post sync summary
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ✅ Sync completed successfully"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "econ-ark/HAFiscal updated from:"
          echo "  Source: HAFiscal-Public@${{ steps.source.outputs.short }}"
          echo "  Message: ${{ steps.source.outputs.message }}"
          echo ""
          echo "Verify at: https://github.com/econ-ark/HAFiscal/commits/master"
          
      - name: No changes summary
        if: steps.changes.outputs.has_changes == 'false'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "  ℹ️  No sync needed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "econ-ark/HAFiscal is already up to date with:"
          echo "  Source: HAFiscal-Public@${{ steps.source.outputs.short }}"

